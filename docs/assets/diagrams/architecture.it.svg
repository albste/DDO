<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Architettura tecnica del DDO: 6 livelli</title>
  <desc id="d">Sei livelli dall'alto in basso: client, identità e credenziali, punteggio, prove di abilitazione, voto, registri pubblici. Ogni livello dipende solo da quello sopra. Liste di revoca, versioni delle regole di punteggio e schede cifrate sono pubblicate nei registri pubblici, che chiunque può verificare.</desc>
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2937">Architettura tecnica del DDO</text>
  <text x="30" y="62" font-size="13" fill="#4b5563">6 livelli. Ognuno dipende solo da quello sopra ed espone solo ciò che serve al successivo.</text>

  <rect x="30" y="80" width="940" height="64" rx="8" fill="#f3f4f6" stroke="#1e4e8c" stroke-width="1.5"/>
  <circle cx="62" cy="112" r="14" fill="#1e4e8c"/><text x="62" y="117" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="90" y="106" font-size="15" font-weight="700" fill="#1f2937">Client</text>
  <text x="90" y="128" font-size="13" fill="#374151">App portafoglio e cabine pubbliche. Chiavi in hardware sicuro; la biometria sblocca solo in locale.</text>
  <path d="M492 144l8 8 8-8z" fill="#9ca3af"/>

  <rect x="30" y="156" width="940" height="64" rx="8" fill="#f3f4f6" stroke="#1e4e8c" stroke-width="1.5"/>
  <circle cx="62" cy="188" r="14" fill="#1e4e8c"/><text x="62" y="193" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="90" y="182" font-size="15" font-weight="700" fill="#1f2937">Identità e credenziali</text>
  <text x="90" y="204" font-size="13" fill="#374151">DID e credenziali verificabili: cittadinanza, età, residenza, ruolo. Recupero sociale delle chiavi.</text>
  <text x="950" y="182" font-size="12" fill="#b45309" text-anchor="end">pubblica: liste di revoca</text>
  <path d="M492 220l8 8 8-8z" fill="#9ca3af"/>

  <rect x="30" y="232" width="940" height="64" rx="8" fill="#f3f4f6" stroke="#1e4e8c" stroke-width="1.5"/>
  <circle cx="62" cy="264" r="14" fill="#1e4e8c"/><text x="62" y="269" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="90" y="258" font-size="15" font-weight="700" fill="#1f2937">Punteggio</text>
  <text x="90" y="280" font-size="13" fill="#374151">Regole pubbliche e versionate trasformano input verificati in credenziali di punteggio a scadenza.</text>
  <text x="950" y="258" font-size="12" fill="#b45309" text-anchor="end">pubblica: versioni delle regole</text>
  <path d="M492 296l8 8 8-8z" fill="#9ca3af"/>

  <rect x="30" y="308" width="940" height="64" rx="8" fill="#f3f4f6" stroke="#1e4e8c" stroke-width="1.5"/>
  <circle cx="62" cy="340" r="14" fill="#1e4e8c"/><text x="62" y="345" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="90" y="334" font-size="15" font-weight="700" fill="#1f2937">Prove di abilitazione</text>
  <text x="90" y="356" font-size="13" fill="#374151">Prove a conoscenza zero di abilitazione e fascia di peso, più un nullifier per quesito.</text>
  <path d="M492 372l8 8 8-8z" fill="#9ca3af"/>

  <rect x="30" y="384" width="940" height="64" rx="8" fill="#f3f4f6" stroke="#1e4e8c" stroke-width="1.5"/>
  <circle cx="62" cy="416" r="14" fill="#1e4e8c"/><text x="62" y="421" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="90" y="410" font-size="15" font-weight="700" fill="#1f2937">Voto</text>
  <text x="90" y="432" font-size="13" fill="#374151">Schede cifrate a soglia, spoglio verificabile, controllo del dispositivo con sfida e annullamento.</text>
  <text x="950" y="410" font-size="12" fill="#b45309" text-anchor="end">pubblica: schede cifrate</text>
  <path d="M492 448l8 8 8-8z" fill="#9ca3af"/>

  <rect x="30" y="460" width="940" height="64" rx="8" fill="#1e4e8c"/>
  <circle cx="62" cy="492" r="14" fill="#ffffff"/><text x="62" y="497" font-size="14" font-weight="700" fill="#1e4e8c" text-anchor="middle">6</text>
  <text x="90" y="486" font-size="15" font-weight="700" fill="#ffffff">Registri pubblici</text>
  <text x="90" y="508" font-size="13" fill="#dbeafe">Registri di trasparenza cofirmati da testimoni indipendenti. Nessun dato personale.</text>
  <text x="950" y="486" font-size="12" fill="#ffffff" text-anchor="end">punto di verifica condiviso</text>

  <text x="30" y="548" font-size="13" fill="#374151">Anche le tracce di audit delle azioni degli operatori finiscono nei registri pubblici, così chiunque può controllare il sistema senza fidarsi di chi lo gestisce.</text>
</svg>
